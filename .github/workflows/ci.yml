name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      pages:
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    working-directory: client

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run test:ci
      - run: git diff --exit-code
      - uses: actions/upload-pages-artifact@v3
        if: inputs.pages
        with:
          path: client/dist
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - run: go test ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13
          working-directory: server
  browser:
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Warm up Chrome so the first tests do not pay its cold start
        run: |
          node -e "require('playwright-core').chromium.launch({ channel: 'chrome' }).then((browser) => browser.close())"
      - run: npm run test:pwa:smoke
