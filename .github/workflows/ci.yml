name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      pages:
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    working-directory: client

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run test:ci
      - run: git diff --exit-code
      - uses: actions/upload-pages-artifact@v5
        if: inputs.pages
        with:
          path: client/dist
  ai:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run test:integration
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@90ad2b35f69faf97585ad74d28fa006d2739b7af
        with:
          go-version: "1.27.1"
          cache: true
          cache-dependency-path: server/go.sum
      - run: go test ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.14
          working-directory: server
  browser:
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Warm up Chrome so the first tests do not pay its cold start
        run: |
          node -e "require('playwright-core').chromium.launch({ channel: 'chrome' }).then((browser) => browser.close())"
      - run: npm run test:pwa:smoke
