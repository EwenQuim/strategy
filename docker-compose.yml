services:
  app:
    build: .
    ports:
      - "8080:8080"
    # DB_PATH: /data/hexmate.db  # persist online games across restarts (needs a writable volume)
    develop:
      watch:
        - path: ./server
          action: rebuild
        - path: ./client/src
          action: rebuild
        - path: ./client/public
          action: rebuild
        - path: ./client/index.html
          action: rebuild
